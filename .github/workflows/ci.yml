name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Valores fictícios: build e testes não precisam de credenciais reais.
# Se secrets de mesmo nome forem configurados no repositório, eles têm precedência.
env:
  NEXT_TELEMETRY_DISABLED: 1
  DATABASE_URL: postgresql://training:training@localhost:5432/training_area?schema=public
  AUTH_SECRET: ${{ secrets.AUTH_SECRET || 'ci-only-insecure-auth-secret-do-not-use' }}
  AUTH_URL: http://localhost:3000
  AUTH_GOOGLE_ID: ${{ secrets.AUTH_GOOGLE_ID || 'ci-google-client-id' }}
  AUTH_GOOGLE_SECRET: ${{ secrets.AUTH_GOOGLE_SECRET || 'ci-google-client-secret' }}
  AUTH_MICROSOFT_ENTRA_ID_ID: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_ID || 'ci-entra-client-id' }}
  AUTH_MICROSOFT_ENTRA_ID_SECRET: ${{ secrets.AUTH_MICROSOFT_ENTRA_ID_SECRET || 'ci-entra-client-secret' }}
  AUTH_MICROSOFT_ENTRA_ID_ISSUER: https://login.microsoftonline.com/common/v2.0
  AI_PROVIDER: mock
  AI_API_KEY: ""
  AI_MODEL: ""
  TENANT_RESOLUTION: single
  DEFAULT_TENANT_SLUG: default
  APP_ROOT_DOMAIN: ""

jobs:
  quality:
    name: Lint, typecheck, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma generate
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: training
          POSTGRES_PASSWORD: training
          POSTGRES_DB: training_area
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U training -d training_area"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
